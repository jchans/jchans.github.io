      <h1>2026-06-23 Tue</h1>
      <main><p>在 Linux 下不用 Vim 之類感覺好像怪怪的？但最近發現的這個微軟的 edit 魔改版蠻喜歡的，覺得很接近我想要的打字書寫的手感：「左邊有段落數字、右邊有字數，一行三十個中文字。」</p>
<p>「控制一個段落在 200 字左右」我覺得是一個寫長文的好作法，以 2020 年代的人類來說，可能一個段落超過 300 字閱讀就有點困難了吧。右邊有段落字數統計，比較方便自己控制書寫的節奏與內容。</p>
<p>好像，有點開心？終於找到接近自己想要的書寫工具的感覺。</p>
</main>
